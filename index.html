<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中小企業経営者向け 資金調達・優遇制度 日刊レポート</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

        :root {
            --primary: #1a2744;
            --secondary: #c9a84c;
            --accent: #8b1a1a;
            --light-gold: #f5e6c4;
            --text-dark: #1a1a2e;
            --text-medium: #4a4a6a;
            --text-light: #7a7a9a;
            --bg-main: #f8f7f4;
            --bg-white: #ffffff;
            --bg-dark: #0f1c3a;
            --border-gold: #c9a84c;
            --shadow-soft: 0 4px 24px rgba(26, 39, 68, 0.08);
            --shadow-medium: 0 8px 40px rgba(26, 39, 68, 0.14);
            --shadow-strong: 0 16px 60px rgba(26, 39, 68, 0.20);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.8;
            font-size: 15px;
        }

        /* ========== HEADER ========== */
        header {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--primary) 60%, #2a3f6f 100%);
            color: #fff;
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(201, 168, 76, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(201, 168, 76, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .header-top-bar {
            background: rgba(201, 168, 76, 0.15);
            border-bottom: 1px solid rgba(201, 168, 76, 0.3);
            padding: 8px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.7);
        }

        .header-top-bar .edition {
            color: var(--secondary);
            font-weight: 500;
        }

        .header-main {
            padding: 50px 40px 40px;
            position: relative;
            z-index: 1;
        }

        .header-label {
            display: inline-block;
            background: linear-gradient(90deg, var(--secondary), #e8c87a);
            color: var(--primary);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
            padding: 5px 16px;
            border-radius: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .header-title-main {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(22px, 3.5vw, 38px);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .header-title-sub {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(13px, 1.8vw, 17px);
            font-weight: 300;
            color: rgba(255,255,255,0.65);
            letter-spacing: 0.1em;
            margin-bottom: 30px;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .header-date {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-date::before {
            content: '';
            display: inline-block;
            width: 18px;
            height: 1px;
            background: var(--secondary);
        }

        .header-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-tag {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.75);
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 0.05em;
        }

        .header-divider {
            height: 4px;
            background: linear-gradient(90deg, var(--secondary) 0%, #e8c87a 30%, rgba(201,168,76,0.3) 70%, transparent 100%);
        }

        /* ========== NAVIGATION ========== */
        .toc-nav {
            background: var(--bg-white);
            border-bottom: 1px solid rgba(26, 39, 68, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
        }

        .toc-nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
            gap: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .toc-nav-inner::-webkit-scrollbar {
            display: none;
        }

        .toc-nav-label {
            font-size: 11px;
            color: var(--text-light);
            letter-spacing: 0.1em;
            white-space: nowrap;
            padding-right: 20px;
            border-right: 1px solid rgba(0,0,0,0.1);
            margin-right: 20px;
        }

        .toc-link {
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: var(--text-medium);
            font-size: 13px;
            font-weight: 500;
            padding: 16px 18px;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            letter-spacing: 0.03em;
        }

        .toc-link:hover {
            color: var(--primary);
            border-bottom-color: var(--secondary);
        }

        .toc-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
        }

        /* ========== MAIN LAYOUT ========== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        /* ========== SUMMARY BOX ========== */
        .summary-box {
            background: linear-gradient(135deg, var(--primary) 0%, #2a3f6f 100%);
            border-radius: 12px;
            padding: 40px 48px;
            margin-bottom: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-strong);
        }

        .summary-box::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 300px;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(201,168,76,0.06));
        }

        .summary-box::after {
            content: '＊';
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 120px;
            color: rgba(201,168,76,0.06);
            font-family: serif;
        }

        .summary-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--secondary);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .summary-title {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(18px, 2.5vw, 24px);
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .summary-text {
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            line-height: 1.9;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: rgba(201,168,76,0.2);
            margin-top: 30px;
            border-radius: 8px;
            overflow: hidden;
        }

        .summary-item {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .summary-item-num {
            font-family: 'Noto Serif JP', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--secondary);
            display: block;
        }

        .summary-item-label {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
            letter-spacing: 0.05em;
        }

        /* ========== SECTION STYLES ========== */
        .section {
            margin-bottom: 70px;
        }

        .section-header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(26, 39, 68, 0.1);
        }

        .section-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            box-shadow: var(--shadow-soft);
        }

        .icon-subsidy { background: linear-gradient(135deg, #1a5276, #2e86c1); }
        .icon-grant { background: linear-gradient(135deg, #145a32, #1e8449); }
        .icon-loan { background: linear-gradient(135deg, #6e2f1a, #c0392b); }
        .icon-tax { background: linear-gradient(135deg, #4a235a, #8e44ad); }

        .section-header-text {
            flex: 1;
        }

        .section-category {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .cat-subsidy { color: #2e86c1; }
        .cat-grant { color: #1e8449; }
        .cat-loan { color: #c0392b; }
        .cat-tax { color: #8e44ad; }

        .section-title {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(19px, 2.8vw, 26px);
            font-weight: 700;
            color: var(--primary);
            line-height: 1.4;
            letter-spacing: 0.03em;
        }

        .section-number {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 6px;
            letter-spacing: 0.08em;
        }

        /* ========== CARD ========== */
        .card {
            background: var(--bg-white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            margin-bottom: 24px;
            border: 1px solid rgba(26, 39, 68, 0.06);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-medium);
            transform: translateY(-2px);
        }

        .card-top {
            height: 4px;
        }

        .card-top-subsidy { background: linear-gradient(90deg, #1a5276, #2e86c1, #85c1e9); }
        .card-top-grant { background: linear-gradient(90deg, #145a32, #1e8449, #82e0aa); }
        .card-top-loan { background: linear-gradient(90deg, #6e2f1a, #c0392b, #f1948a); }
        .card-top-tax { background: linear-gradient(90deg, #4a235a, #8e44ad, #d2b4de); }

        .card-body {
            padding: 32px 36px;
        }

        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px
